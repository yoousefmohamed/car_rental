<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:;">
  <title>نظام تأجير السيارات — Car Rental ERP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <div class="auth-box">
      <div class="auth-brand">🚗 <span id="auth-company-name">نظام تأجير السيارات</span></div>
      <div id="auth-form-wrap"></div>
    </div>
  </div>

  <div id="app-shell" style="display:none">
    <aside id="sidebar">
      <div class="brand">🚗 تأجير السيارات
        <small>Car Rental ERP — نسخة MVP</small>
      </div>
      <nav id="sidebar-nav"></nav>
      <div id="sidebar-footer">
        <div id="current-user-badge" class="current-user-badge"></div>
        <button class="sidebar-btn" id="logout-btn">🚪 تسجيل الخروج</button>
      </div>
    </aside>

    <main id="main">
      <div id="topbar">
        <span id="page-title"></span>
        <div class="topbar-search-wrap">
          <input type="text" id="global-search" class="input" placeholder="بحث سريع: رقم عقد، اسم عميل، رقم هاتف، رقم لوحة، رقم شاسيه...">
          <div id="global-search-results"></div>
        </div>
        <div class="topbar-actions">
          <div class="notif-wrap">
            <button class="topbar-icon-btn" id="notif-bell-btn" title="التنبيهات">🔔<span id="notif-count" class="notif-count" style="display:none">0</span></button>
            <div id="notif-dropdown" class="notif-dropdown"></div>
          </div>
          <button class="topbar-icon-btn" id="theme-toggle-btn" title="تبديل الوضع الداكن/الفاتح">🌙</button>
        </div>
      </div>
      <div id="app-content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-wrap"></div>
  <input type="file" id="restore-input" accept=".json" style="display:none">

  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/vehicles.js"></script>
  <script src="js/modules/customers.js"></script>
  <script src="js/modules/bookings.js"></script>
  <script src="js/modules/contracts.js"></script>
  <script src="js/modules/returns.js"></script>
  <script src="js/modules/maintenance.js"></script>
  <script src="js/modules/incidents.js"></script>
  <script src="js/modules/treasury.js"></script>
  <script src="js/modules/expenses.js"></script>
  <script src="js/modules/reports.js"></script>
  <script src="js/modules/partners.js"></script>
  <script src="js/modules/balances.js"></script>
  <script src="js/modules/users.js"></script>
  <script src="js/modules/employees.js"></script>
  <script src="js/modules/activityLog.js"></script>
  <script src="js/modules/trash.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
